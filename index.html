<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *">
  <title>Manga Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <header id="top-bar">
      <button id="btn-back" class="hidden">&#8592; Volver</button>
      <span id="top-title">Mi biblioteca</span>
      <span id="page-counter"></span>
    </header>

    <div id="library-view" class="view">
      <div id="library-grid">Cargando biblioteca...</div>
    </div>

    <div id="chapters-view" class="view hidden">
      <div id="continue-box" class="hidden"></div>
      <div id="chapter-list">Cargando cap&#237;tulos...</div>
    </div>

    <div id="viewer-view" class="view hidden">
      <main id="viewer">
        <img id="page-image" src="" alt="P&#225;gina del manga">
        <div id="viewer-message"></div>
        <button id="btn-prev" class="nav-zone left"></button>
        <button id="btn-next" class="nav-zone right"></button>
      </main>
    </div>

  </div>

  <script src="jszip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
