<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <!-- Encabezado con nombre del capítulo y botón de cargar -->
    <header id="top-bar">
      <button id="btn-load">📂 Cargar</button>
      <span id="chapter-name">Sin capítulo cargado</span>
      <span id="page-counter">0 / 0</span>
    </header>

    <!-- Área donde se muestra la página del manga -->
    <main id="viewer">
      <img id="page-image" src="" alt="Página del manga">
      <button id="btn-prev" class="nav-zone left"></button>
      <button id="btn-next" class="nav-zone right"></button>
    </main>

    <!-- Caja de texto para el diálogo de la página y control de lectura en voz -->
    <section id="tts-panel">
      <textarea id="page-text" placeholder="Escribe o pega aquí el diálogo de esta página..."></textarea>
      <div id="tts-controls">
        <button id="btn-play">▶️ Leer</button>
        <button id="btn-pause">⏸️ Pausar</button>
        <button id="btn-stop">⏹️ Detener</button>
        <label id="speed-label">
          Velocidad
          <input type="range" id="speed-range" min="0.5" max="2" step="0.1" value="1">
        </label>
      </div>
    </section>

    <!-- Input oculto para seleccionar las imágenes del capítulo -->
    <input type="file" id="file-input" accept="image/*" multiple hidden>

  </div>

  <script src="script.js"></script>
</body>
</html>
